name: checks

# The things CONTRIBUTING says drift silently — the generated/ adapters, the
# claude-ai-skill-reference.md mirror, skill counts, the catalogs and the /help
# cheat sheet (all in verify-adapters.mjs) — plus the motion scenes themselves and
# the two Python unittest suites that ship with skills. No dependencies anywhere
# (Node scripts and stdlib-only Python), matching the repo's no-build rule.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  adapters:
    name: generated/ matches skills/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # A CI runner has no ~/.agents/skills install, so skip that one check.
      - run: node verify-adapters.mjs --skip-install

  ai-export-tests:
    name: ai-export tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unittest
        working-directory: skills/ai-export
        run: python3 -m unittest test_convert -v

  # The harness tests compile and run the real Swift helpers (swiftc, CoreGraphics),
  # so they need a macOS runner. They post no input and launch no app.
  harness-tests:
    name: test-desktop-app harness tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: unittest
        working-directory: skills/test-desktop-app/harness
        run: python3 -m unittest tests.test_harness -v

  scenes:
    name: motion scenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Static rules need nothing but Node, so they run even if the browser
      # step below is unavailable.
      - name: Static rules
        run: node skills/motion-artifact/scenes/check.mjs

      - name: Locate Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser
            CHROME=$(command -v chromium-browser || command -v chromium)
          fi
          echo "Using $CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      # Proves every scene is a pure function of t by comparing a cold seek
      # against playing forward. Needs Chrome but not ffmpeg, so it is cheap
      # enough to gate every PR.
      - name: Purity
        run: node skills/motion-artifact/scenes/check.mjs --purity
