<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northwind walkthrough</title>
<style>
@font-face { font-family: "Fraunces"; src: url("node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2") format("woff2-variations"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "Inter"; src: url("node_modules/@fontsource-variable/inter/files/inter-latin-opsz-normal.woff2") format("woff2-variations"); font-weight: 100 900; font-display: block; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body),system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.display{font-family:var(--display),Georgia,serif;font-optical-sizing:auto}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
#wash{position:absolute;inset:0;pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#dots{position:absolute;inset:0;background-image:radial-gradient(circle, var(--dot) 1.7px, transparent 2.2px);background-size:34px 34px}
#links{position:absolute;left:0;top:0;overflow:visible}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 48%, transparent 55%, rgba(60,55,30,.07) 100%)}
#hud{position:absolute;inset:0;pointer-events:none}
#fadeT{position:absolute;left:0;right:0;top:0;height:135px;background:linear-gradient(var(--bg) 12%,color-mix(in oklab,var(--bg) 0%,transparent))}
#fadeB{position:absolute;left:0;right:0;bottom:0;height:230px;background:linear-gradient(color-mix(in oklab,var(--bg) 0%,transparent),color-mix(in oklab,var(--bg) 92%,transparent) 70%)}

/* cards */
.card{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:34px 36px 36px;will-change:transform,opacity}
.ct{font-family:var(--display);font-weight:600;font-size:36px;letter-spacing:-.01em;line-height:1.1}
.row{display:flex;align-items:center;gap:14px}
.between{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:9px}
.field label{font-size:16px;font-weight:600;color:var(--text)}
.field label .opt{font-weight:500;color:var(--muted)}
.input{position:relative;height:56px;border:1.5px solid var(--border2);border-radius:var(--r);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 16px;font-size:19px;color:var(--text);white-space:nowrap;overflow:hidden}
.input .ico{width:20px;height:20px;flex:none;color:var(--muted)}
.input .txt{display:flex;align-items:center;min-width:0}
.input .ph{color:color-mix(in oklab,var(--muted) 70%,white)}
.input .caret{display:inline-block;width:2px;height:24px;background:var(--text);margin-left:1px}
.input .ok{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center;flex:none}
.input .ok svg{width:16px;height:16px}
.input .sel{background:color-mix(in oklab,var(--accent) 55%,transparent);border-radius:3px}
.btn{height:58px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:19px;padding:0 28px;white-space:nowrap}
.btn.primary{background:var(--text);color:var(--bg)}
.btn svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:16px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip svg{width:16px;height:16px}
.mark{display:inline-block;position:relative;flex:none;background:var(--mark);border-radius:22%}
.mark::after{content:"";position:absolute;left:34.4%;top:34.4%;width:31.2%;height:31.2%;background:var(--accent);border-radius:25%}
.wm{font-family:var(--display);font-weight:700}
.muted{color:var(--muted)}
.hlw{position:relative;display:inline-block;z-index:0;white-space:nowrap}
.hlw .bar{position:absolute;left:-.04em;right:-.04em;bottom:.06em;height:.36em;background:var(--accent);z-index:-1;transform-origin:0 50%}

/* s1 */
#s1 .brandrow{gap:12px;margin-bottom:18px}
#s1 .brandrow .wm{font-size:20px}
#s1 .ct{margin-bottom:28px}
#s1 .field{margin-bottom:22px}
#s1 .btn{margin-top:8px;width:100%}
.toast{position:absolute;top:-30px;right:-34px;display:flex;align-items:center;gap:12px;height:62px;padding:0 24px 0 16px;border-radius:12px;background:var(--goodSoft);color:var(--good);font-weight:650;font-size:20px;box-shadow:var(--shadowSoft);border:1px solid color-mix(in oklab,var(--good) 25%,white);white-space:nowrap;transform-origin:85% 50%}
.toast .tick{width:34px;height:34px;border-radius:50%;background:var(--good);color:white;display:flex;align-items:center;justify-content:center}
.toast .tick svg{width:20px;height:20px}

/* s2 */
#s2 .balance{display:flex;align-items:baseline;gap:14px;margin:18px 0 26px}
#s2 .num{font-family:var(--display);font-weight:600;font-size:116px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#s2 .unit{font-size:24px;font-weight:600;color:var(--muted)}
#s2 .delta{margin-left:auto;align-self:center;height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--onAccent);font-weight:700;font-size:20px;display:flex;align-items:center}
#s2 .lbl{font-size:16px;font-weight:600;margin-bottom:10px}
#s2 .packs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.pack{height:96px;border:1.5px solid var(--border2);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--surface)}
.pack b{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05}
.pack span{font-size:15px;color:var(--muted);font-weight:500}
#s2 .btn{width:100%}
.note{display:flex;align-items:center;gap:12px;font-size:19px;color:var(--text);margin-top:22px;font-weight:500}
.note svg{width:22px;height:22px;color:var(--accentText);flex:none}

/* s3 */
#s3 .head{margin-bottom:24px}
#s3 .grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin-bottom:20px}
.pills{display:flex;gap:10px}
.pill{height:50px;padding:0 20px;border-radius:var(--r);border:1.5px solid var(--border2);display:flex;align-items:center;font-size:18px;font-weight:600;color:var(--muted);background:var(--surface);white-space:nowrap}
#s3 .fieldwide{margin-bottom:20px}
#s3 .grid3{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;margin-bottom:26px}
#s3 .foot{border-top:1px solid var(--border);padding-top:22px}
#s3 .lbl{font-size:15px;color:var(--muted);font-weight:600}
#s3 .cost{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums}
#s3 .cost small{font-family:var(--body);font-size:19px;color:var(--muted);font-weight:600;margin-left:6px}
#s3 .btn{width:250px}

/* order cards */
.meta{font-size:17px;color:var(--muted);margin-top:6px;font-weight:500}
.status{height:40px;padding:0 16px;border-radius:999px;font-size:17px;font-weight:650;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;background:currentColor;display:block}
.track{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin:28px 0 26px}
.track .line{position:absolute;left:10%;right:10%;top:13px;height:4px;border-radius:2px;background:var(--track)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accentText)}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.node{width:30px;height:30px;border-radius:50%;background:var(--surface);border:2.5px solid var(--track);display:flex;align-items:center;justify-content:center;position:relative}
.node svg{width:16px;height:16px;color:var(--onAccent)}
.step .sl{font-size:15px;font-weight:600;color:var(--muted);line-height:1.25;max-width:120px}
.editor{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);margin-bottom:18px}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center;flex:none}
.avatar svg{width:26px;height:26px}
.editor b{display:block;font-size:19px}
.editor span.muted{font-size:16px}
.editor .chip{margin-left:auto;background:var(--accent);color:var(--onAccent);border-color:transparent}
.thread{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.sys{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted);font-weight:500}
.sys::before,.sys::after{content:"";flex:1;height:1px;background:var(--border)}
.bubwrap{height:58px;position:relative}
.bubble{position:absolute;left:0;top:0;height:58px;display:flex;align-items:center;gap:12px;padding:0 22px 0 10px;border-radius:16px 16px 16px 6px;background:var(--surface2);border:1px solid var(--border);font-size:19px;font-weight:500;transform-origin:0 100%;white-space:nowrap}
.bubble .av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center}
.bubble .av svg{width:20px;height:20px}
.dots{display:flex;gap:6px;padding:0 6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:block}
.composer{display:flex;gap:12px}
.composer .input{flex:1}
.send{width:56px;height:56px;border-radius:var(--r);background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.send svg{width:22px;height:22px}
.preview{position:relative;height:250px;border-radius:12px;overflow:hidden;margin-bottom:20px;border:1px solid var(--border)}
.preview svg.scene{position:absolute;inset:0;width:100%;height:100%}
.preview .play{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.preview .play svg{width:30px;height:30px;margin-left:5px;color:var(--text)}
.preview .tag{position:absolute;left:16px;top:16px;height:34px;padding:0 14px;border-radius:999px;background:var(--accent);color:var(--onAccent);font-weight:700;font-size:15px;display:flex;align-items:center}
.preview .dur{position:absolute;right:16px;bottom:16px;height:30px;padding:0 10px;border-radius:6px;background:rgba(20,20,15,.78);color:white;font-weight:600;font-size:15px;display:flex;align-items:center;font-variant-numeric:tabular-nums}
#s5 .btnwrap{position:relative;height:58px;margin-bottom:22px}
#s5 .btn{position:absolute;inset:0}
#s5 .notes{display:flex;flex-direction:column;gap:12px}
#s5 .notes .note{margin-top:0;font-size:18px}

/* hud */
.tag-l{position:absolute;left:72px;top:58px;display:flex;align-items:center;gap:14px}
.tag-l .wm{font-size:28px}
.tag-r{position:absolute;right:72px;top:62px;display:flex;align-items:center;gap:18px;font-size:19px;font-weight:600;color:var(--muted)}
.sdots{display:flex;gap:8px}
.sdots i{display:block;width:10px;height:10px;border-radius:50%;background:var(--track)}
.cap{position:absolute;left:72px;bottom:70px;display:flex;align-items:center;gap:22px}
.cap .num{width:64px;height:64px;border-radius:var(--r);background:var(--accent);color:var(--onAccent);font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;box-shadow:var(--shadowSoft)}
.cap .t{font-family:var(--display);font-weight:600;font-size:50px;letter-spacing:-.015em;white-space:nowrap}
.cap .t span{display:inline-block;margin-right:.24em}
#map{position:absolute;right:72px;bottom:70px;background:color-mix(in oklab,var(--surface) 88%,transparent);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadowSoft);padding:12px}
#map .inner{position:relative;overflow:hidden;border-radius:4px}
#map .r{position:absolute;border-radius:3px;background:var(--track)}
#map .cam{position:absolute;border:2px solid var(--text);border-radius:4px}
#headline{position:absolute;left:0;right:0;top:92px;text-align:center;font-family:var(--display);font-weight:600;font-size:92px;letter-spacing:-.02em;line-height:1.1}
#headline .w{display:inline-block;margin:0 .12em}
.cursor{position:absolute;left:0;top:0;will-change:transform}
.cursor svg.arrow{width:34px;height:40px;display:block;filter:drop-shadow(0 3px 6px rgba(30,30,20,.28))}
.cursor .name{position:absolute;left:26px;top:34px;height:32px;padding:0 13px;border-radius:999px;font-size:16px;font-weight:700;display:flex;align-items:center;white-space:nowrap;box-shadow:0 4px 10px rgba(30,30,20,.18)}
.cursor.ink .name{background:var(--text);color:var(--bg)}
.cursor.neon .name{background:var(--accent);color:var(--onAccent)}
.cursor .ring{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:3px solid var(--accentText)}
#endcard{position:absolute;inset:0;background:radial-gradient(900px 600px at 50% 48%, color-mix(in oklab,var(--accent) 14%,transparent), transparent 70%),radial-gradient(circle, var(--dot) 1.7px, transparent 2.2px) 0 0/34px 34px,var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
#endcard .lock{display:flex;align-items:center;gap:34px}
#endcard .mark{width:132px;height:132px}
#endcard .w1{font-family:var(--display);font-weight:700;font-size:168px;letter-spacing:-.025em;line-height:1}
#endcard .w2{font-family:var(--display);font-weight:700;font-size:76px;letter-spacing:-.01em;color:var(--muted);align-self:flex-end;margin-bottom:22px;margin-left:-8px}
#endcard .pill{margin-top:56px;height:74px;padding:0 34px;border-radius:999px;background:var(--accent);color:var(--onAccent);font-size:30px;font-weight:600;display:flex;align-items:center;gap:16px}
#endcard .pill b{font-weight:800;letter-spacing:.02em}
#endcard .pill i{width:7px;height:7px;border-radius:50%;background:var(--onAccent);opacity:.55;display:block}
#endcard .url{margin-top:30px;font-size:40px;font-weight:600;letter-spacing:-.01em}
#endcard .small{margin-top:16px;font-size:20px;color:var(--muted);font-weight:500}
</style>
</head>
<body>
<div id="stage">
  <div id="wash"></div>
  <div id="world"><div id="dots"></div><svg id="links"></svg></div>
  <div id="vig"></div>
  <div id="hud"></div>
</div>
<script>
(function(){
const qs = new URLSearchParams(location.search);
const cfgName = qs.get("c") || "example";
const s = document.createElement("script");
s.src = "config." + cfgName + ".js";
let resolveReady;
window.ready = new Promise(r => resolveReady = r);
s.onload = () => boot().then(resolveReady);
document.head.appendChild(s);

/* ---------- helpers ---------- */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,s,d)=>clamp((t-s)/d);
const E={
  outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),
  outBack:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  inCubic:x=>x*x*x,
  outCubic:x=>1-Math.pow(1-x,3),
  inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2,
};
function setT(el,tr){ el.style.transform=tr; }
function rise(el,t,st,o={}){
  const dy=o.dy??70, blur=o.blur??10, d=o.d??0.7;
  const p=E.outExpo(prog(t,st,d));
  el.style.opacity=clamp((t-st)/(d*0.4));
  el.style.transform=`translateY(${(1-p)*dy}px)`;
  const b=(1-p)*blur; el.style.filter=b>0.05?`blur(${b}px)`:"none";
}
function pop(el,t,st,o={}){
  const d=o.d??0.45, from=o.from??0.6;
  const p=prog(t,st,d); const k=p<=0?0:E.outBack(p);
  el.style.opacity=clamp(p*3);
  el.style.transform=`scale(${from+(1-from)*k})`+(o.extra||"");
}
function show(el,on){ el.style.display=on?"":"none"; }
const ICON={
  check:'<path d="M20 6 9 17l-5-5"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  ticket:'<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  refresh:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  pin:'<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  note:'<path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/>',
  ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>',
  infinity:'<path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z"/>',
  upload:'<path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/>',
};
const ico=(n,cls="")=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const inputHTML=(id,icon,ph)=>`<div class="input" id="${id}">${icon?ico(icon,"ico"):""}<span class="txt"><span class="val"></span><span class="caret"></span><span class="ph">${ph||""}</span></span><span class="ok">${ico("check")}</span></div>`;

/* typing: chars appear at start + k/cps */
function typed(text,t,start,cps){ if(t<start) return ""; return text.slice(0,Math.min(text.length,Math.floor((t-start)*cps)+1)); }
function setInput(el,{text="",t,focus=[1e9,-1],typing=[1e9,-1],ok=null,sel=null}){
  const v=el.querySelector(".val"), c=el.querySelector(".caret"), ph=el.querySelector(".ph"), okEl=el.querySelector(".ok");
  if(v.textContent!==text) v.textContent=text;
  ph.style.display=text?"none":"";
  const f=t>=focus[0]&&t<focus[1];
  const fp=f?E.outCubic(prog(t,focus[0],0.2)):0;
  el.style.borderColor=f?"var(--text)":"";
  el.style.boxShadow=f?`0 0 0 ${4*fp}px color-mix(in oklab, var(--accent) 45%, transparent)`:"none";
  const isTyping=t>=typing[0]&&t<typing[1]+0.1;
  const blinkOn=Math.floor((t-focus[0])/0.5)%2===0;
  c.style.opacity=f&&(isTyping||blinkOn)?1:0;
  c.style.order=0;
  if(sel!=null){ v.classList.toggle("sel", t>=sel && t<sel+0.35); } else v.classList.remove("sel");
  if(ok!=null){ okEl.style.display=""; pop(okEl,t,ok,{from:0.3}); } else okEl.style.display="none";
}

/* ---------- boot ---------- */
let A, W, ST, CUR, cams=[], overview, worldEl, links=[], mapEl, mapInner, mapRects=[], mapCam, bbox, mapScale;
const CUES=[]; window.CUES=CUES;
const cue=(t,type,v)=>CUES.push({t:+t.toFixed(4),type,v});

async function boot(){
  A=window.AD; const B=A.brand, T=A.timing;
  const root=document.documentElement.style;
  for(const [k,v] of Object.entries(B)) root.setProperty("--"+k, typeof v==="number"?v+"px":v);
  root.setProperty("--r", B.radius+"px");
  worldEl=document.getElementById("world");

function worldPos(el){
  let x=0,y=0,n=el;
  while(n && n!==worldEl){ x+=n.offsetLeft; y+=n.offsetTop; n=n.offsetParent; if(n && n!==worldEl){ x+=n.clientLeft; y+=n.clientTop; } }
  return {x,y,w:el.offsetWidth,h:el.offsetHeight};
}

    const e2=e1.cloneNode(); svg.appendChild(e1); svg.appendChild(e2);

/* ---------- camera ---------- */
function holdEnd(i){ const T=A.timing; return i<4?T.stations[i]+T.hold:T.pullback[0]; }
function camAt(t){
  const T=A.timing, S=T.stations;
  const drift=(i,tt)=>{ const c=cams[i]; return {x:c.x,y:c.y,z:c.z*(1+0.03*E.inOutSine(prog(tt,S[i],holdEnd(i)-S[i])))}; };
  const mix=(a,b,p,dip)=>({x:lerp(a.x,b.x,p),y:lerp(a.y,b.y,p),z:Math.exp(lerp(Math.log(a.z),Math.log(b.z),p))*(1-dip*Math.sin(Math.PI*p))});
  if(t<S[1]-1.5){ const c=drift(0,t); const o=E.outCubic(prog(t,0,1.6)); c.z*=lerp(0.9,1,o); c.y+=lerp(30,0,o); return c; }
  for(let i=0;i<4;i++){
    if(t<holdEnd(i)) return drift(i,t);
    if(t<S[i+1]){ const p=E.inOut(prog(t,holdEnd(i),S[i+1]-holdEnd(i))); return mix(drift(i,holdEnd(i)),drift(i+1,S[i+1]),p,0.2); }
  }
  if(t<T.pullback[0]) return drift(4,t);
  const ov=(tt)=>({x:overview.x,y:overview.y,z:overview.z*(1+0.025*E.inOutSine(prog(tt,T.pullback[1],T.total-T.pullback[1])))});
  if(t<T.pullback[1]){ const p=E.inOut(prog(t,T.pullback[0],T.pullback[1]-T.pullback[0])); return mix(drift(4,T.pullback[0]),ov(T.pullback[1]),p,0); }
  return ov(t);
}

/* ---------- cursors ---------- */
function curState(cu,t){
  const ks=cu.keys; let x=ks[0].x,y=ks[0].y,o=ks[0].o??1;
  let prev={x,y,o,pill:ks[0].pill};
  for(let i=0;i<ks.length;i++){
    const k=ks[i], ko=k.o??prev.o;
    if(k.jump){ if(t>=k.t){ prev={x:k.x,y:k.y,o:ko,pill:k.pill}; continue; } else break; }
    const mv=k.move??0.55, st=k.t-mv;
    if(t>=k.t){ prev={x:k.x,y:k.y,o:ko,pill:k.pill}; continue; }
    if(t>st){ const p=E.inOut(prog(t,st,mv)); return {x:lerp(prev.x,k.x,p),y:lerp(prev.y,k.y,p),o:lerp(prev.o,ko,E.outCubic(prog(t,st,mv))),pill:p>0.5?k.pill:prev.pill}; }
    break;
  }
  return prev;
}

/* ---------- cues ---------- */
function buildCues(){
  const T=A.timing, S=T.stations;
  const typeCues=(text,start,cps)=>{ for(let k=0;k<text.length;k++) if(text[k]!==" ") cue(start+k/cps,"key"); };
  // station 1
  let s=ST[0], a=s.at, o=S[0];
  cue(0,"open");
  typeCues(s.email,o+a.email,a.emailCps); typeCues(s.code,o+a.code,a.codeCps);
  cue(o+a.code+s.code.length/a.codeCps+0.1,"pop");
  cue(o+a.toast,"chime");
  s=ST[1]; a=s.at; o=S[1];
  for(let k=0;k<=10;k++) cue(o+a.count+a.countDur*k/10,"count");
  cue(o+a.delta,"chime"); cue(o+a.note,"pop");
  s=ST[2]; a=s.at; o=S[2];
  cue(o+a.format+0.05,"count"); cue(o+a.tier+0.05,"count");
  cue(o+a.footage,"paste"); typeCues(s.music,o+a.music,a.musicCps); typeCues(s.notes,o+a.notes,a.notesCps);
  cue(o+a.done,"chime");
  s=ST[3]; a=s.at; o=S[3];
  cue(o+a.editor,"pop"); cue(o+a.progress+0.05,"pop");
  typeCues(s.message,o+a.msg,a.msgCps); cue(o+a.bubble,"chime");
  s=ST[4]; a=s.at; o=S[4];
  cue(o+a.status,"chime"); cue(o+a.morph,"pop"); cue(o+a.note1,"pop"); cue(o+a.note2,"pop");
  // clicks from cursor keys
  A.cursors.forEach(c=>c.keys.forEach(k=>{ if(k.click) cue(k.t+0.04,"click"); }));
  // camera
  for(let i=0;i<4;i++){ cue(holdEnd(i),"whoosh",S[i+1]-holdEnd(i)); cue(S[i+1],"land"); }
  cue(T.pullback[0],"rise",T.headline-T.pullback[0]);
  A.headline.words.forEach((w,i)=>cue(T.headline+i*0.1,"word"));
  cue(T.headline,"impact"); cue(T.headline+0.6,"hl");
  cue(T.end,"endfade"); cue(T.end+0.3,"pop"); cue(T.end+1.0,"pop"); cue(T.end+1.5,"word");
  CUES.sort((x,y)=>x.t-y.t);
}

/* ---------- per-station renderers (lt = local time since landing) ---------- */
function pillState(el,on,t0,t){ const p=on?E.outCubic(prog(t,t0,0.2)):0; el.style.background=p>0.5?"var(--text)":"var(--surface)"; el.style.color=p>0.5?"var(--bg)":"var(--muted)"; el.style.borderColor=p>0.5?"var(--text)":"var(--border2)"; el.style.transform=`scale(${on?1+0.06*Math.sin(Math.PI*clamp((t-t0)/0.25)):1})`; }
function btnPress(el,t,tc){ const p=clamp((t-tc)/0.22); el.style.transform=`scale(${1-0.05*Math.sin(Math.PI*p)})`; }
function statusSet(el,kind){ const map={pending:["var(--surface2)","var(--muted)","Pending"],progress:["color-mix(in oklab,var(--info) 12%,white)","var(--info)","In progress"],ready:["color-mix(in oklab,var(--info) 12%,white)","var(--info)","Ready for delivery"],delivered:["var(--goodSoft)","var(--good)","Delivered"]}[kind]; el.style.background=map[0]; el.style.color=map[1]; const sp=el.querySelector("span"); if(sp.textContent!==map[2]) sp.textContent=map[2]; }
function trackSet(pre,doneCount,current,t,tFill,fillFrom,fillTo){
  // doneCount: number of completed steps; current: index of current step or -1
  for(let i=0;i<5;i++){
    const n=document.getElementById(`${pre}-node${i}`), sl=n.nextElementSibling, svg=n.querySelector("svg");
    const done=i<doneCount, cur=i===current;
    n.style.background=done?"var(--accent)":"var(--surface)";
    n.style.borderColor=done?"var(--accentText)":cur?"var(--text)":"var(--track)";
    svg.style.opacity=done?1:0;
    n.style.boxShadow=cur?`0 0 0 ${5+3*Math.sin(t*Math.PI*2)}px color-mix(in oklab, var(--accent) 45%, transparent)`:"none";
    sl.style.color=(done||cur)?"var(--text)":"var(--muted)";
  }
  const f=document.getElementById(`${pre}-fill`);
  const p=lerp(fillFrom,fillTo,E.outCubic(prog(t,tFill,0.45)));
  f.style.width=(p*100)+"%";
}

  for(let i=0;i<3;i++){ const p=document.getElementById("s2-p"+i); const on=i===s.pick&&lt>=a.pack;
    p.style.borderColor=on?"var(--text)":"var(--border2)"; p.style.background=on?"color-mix(in oklab,var(--accent) 30%,white)":"var(--surface)";
    p.style.boxShadow=on?"0 0 0 3px var(--text) inset":"none"; p.style.transform=`scale(${on?1+0.05*Math.sin(Math.PI*clamp((lt-a.pack)/0.25)):1})`; }
  btnPress(document.getElementById("s2-btn"),lt,a.btn-0.05);
  const to=s.from+s.packs[s.pick];
  const n=Math.round(lerp(s.from,to,E.outCubic(prog(lt,a.count,a.countDur))));
  const ne=document.getElementById("s2-num"); if(ne.textContent!=String(n)) ne.textContent=n;
  ne.style.color=lt>a.count&&lt<a.count+a.countDur+0.3?"var(--accentText)":"";
  const d=document.getElementById("s2-delta"); if(lt<a.delta) d.style.opacity=0; else pop(d,lt,a.delta,{from:0.4});
  document.getElementById("s2-bar").style.transform=`scaleX(${E.outExpo(prog(lt,a.note,0.5))})`;
 },
 function s3(lt,t){
  const s=ST[2], a=s.at;
  for(let i=0;i<3;i++) pillState(document.getElementById("s3-f"+i), lt>=a.format?i===s.format:i===0, a.format, lt);
  for(let i=0;i<2;i++) pillState(document.getElementById("s3-t"+i), lt>=a.tier?i===s.tier:i===0, a.tier, lt);
  const fEnd=a.footage;
  setInput(document.getElementById("s3-footage"),{text:lt>=a.footage?s.footage:"",t:lt,focus:[1.56,2.0],typing:[a.footage,a.footage],sel:a.footage});
  const mEnd=a.music+s.music.length/a.musicCps;
  setInput(document.getElementById("s3-music"),{text:typed(s.music,lt,a.music,a.musicCps),t:lt,focus:[2.0,2.7],typing:[a.music,mEnd]});
  const nEnd=a.notes+s.notes.length/a.notesCps;
  setInput(document.getElementById("s3-notes"),{text:typed(s.notes,lt,a.notes,a.notesCps),t:lt,focus:[2.7,3.6],typing:[a.notes,nEnd]});
  const cost=lt<a.format?s.costs[0]:lt<a.tier?s.costs[1]:s.costs[2];
  const ce=document.getElementById("s3-cost"); if(ce.textContent!=String(cost)) ce.textContent=cost;
  const bump=Math.max(Math.sin(Math.PI*clamp((lt-a.format)/0.3)),Math.sin(Math.PI*clamp((lt-a.tier)/0.3)));
  ce.parentElement.style.transform=`translateY(${-4*bump}px)`; ce.style.color=bump>0.05?"var(--accentText)":"";
  const b=document.getElementById("s3-btn"); btnPress(b,lt,a.btn-0.05);
  const bt=document.getElementById("s3-btxt"); const done=lt>=a.done;
  const want=done?`${ico("check")}${s.done}`:s.button; if(bt.dataset.s!==String(done)){ bt.innerHTML=want; bt.style.display="flex"; bt.style.alignItems="center"; bt.style.gap="10px"; bt.dataset.s=String(done); }
  b.style.background=done?"var(--good)":"";
 },
 function s4(lt,t){
  const s=ST[3], a=s.at;
  const prog_=lt>=a.progress;
  statusSet(document.getElementById("s4-status"),prog_?"progress":"pending");
  trackSet("s4",prog_?2:1,prog_?2:1,lt,a.progress,0.25,0.5);
  const ed=document.getElementById("s4-editor"), on=lt>=a.editor;
  const en=document.getElementById("s4-en"), es=document.getElementById("s4-es"), av=document.getElementById("s4-av");
  const nm=on?s.editor:s.waiting, sb=on?s.editorSub:s.waitingSub; if(en.textContent!==nm){ en.textContent=nm; es.textContent=sb; }
  en.style.color=on?"":"var(--muted)";
  av.style.background=on?"var(--accent)":"var(--surface)"; av.style.border=on?"none":"2px dashed var(--border2)"; av.style.color=on?"var(--onAccent)":"var(--muted)";
  if(on) pop(av,lt,a.editor,{from:0.5}); else { av.style.opacity=1; av.style.transform="none"; }
  const ep=on?Math.sin(Math.PI*clamp((lt-a.editor)/0.35)):0; ed.style.transform=`scale(${1+0.025*ep})`; ed.style.boxShadow=ep>0?`0 0 0 ${4*ep}px color-mix(in oklab,var(--accent) 45%,transparent)`:"none";
  const tag=document.getElementById("s4-tag"); if(lt<a.editor+0.25) tag.style.opacity=0; else pop(tag,lt,a.editor+0.25);
  const mEnd=a.msg+s.message.length/a.msgCps;
  const sent=lt>=a.send;
  setInput(document.getElementById("s4-msg"),{text:sent?"":typed(s.message,lt,a.msg,a.msgCps),t:lt,focus:[1.5,2.55],typing:[a.msg,mEnd]});
  btnPress(document.getElementById("s4-send"),lt,a.send-0.05);
  const ty=document.getElementById("s4-typing"), bu=document.getElementById("s4-bubble");
  const typingOn=lt>=a.editor+0.35&&lt<a.bubble;
  ty.style.opacity=typingOn?clamp((lt-a.editor-0.35)/0.2):0;
  ty.querySelectorAll(".dots i").forEach((d,i)=>{ d.style.transform=`translateY(${-4*Math.max(0,Math.sin((lt*7-i*0.9)))}px)`; });
  if(lt<a.bubble){ bu.style.opacity=0; } else pop(bu,lt,a.bubble,{from:0.7});
 },
 function s5(lt,t){
  const s=ST[4], a=s.at;
  const del=lt>=a.status;
  statusSet(document.getElementById("s5-status"),del?"delivered":"ready");
  trackSet("s5",del?5:3,del?-1:3,lt,a.status,0.75,1.0);

  const b1=document.getElementById("s5-b1"), b2=document.getElementById("s5-b2");

  [ [n1,a.note1],[n2,a.note2] ].forEach(([n,tt])=>{ const p=E.outExpo(prog(lt,tt,0.5)); n.style.opacity=lt<-1?1:lerp(0.35,1,p); n.querySelector("svg").style.transform=`scale(${1+0.35*Math.sin(Math.PI*clamp((lt-tt)/0.35))})`; });

];

/* ---------- seek ---------- */
function seek(t){
  const T=A.timing, S=T.stations;
  window.__t=t;
  const cam=camAt(t);
  worldEl.style.transform=`translate(960px,540px) scale(${cam.z}) translate(${-cam.x}px,${-cam.y}px)`;
  // wash
  document.getElementById("wash").style.background=
    `radial-gradient(900px 700px at ${1500+120*Math.sin(t*0.21)}px ${180+80*Math.cos(t*0.17)}px, color-mix(in oklab, var(--accent) 16%, transparent), transparent 70%),`+
    `radial-gradient(1000px 800px at ${300+140*Math.cos(t*0.15)}px ${960+60*Math.sin(t*0.19)}px, oklch(0.94 0.03 80 / .7), transparent 70%)`;
  // stations
  const ovP=E.outCubic(prog(t,T.pullback[0],1.5));
  ST.forEach((s,i)=>{
    const el=document.getElementById(s.id);
    const lt=t-S[i];
    R[i](lt,t);
    // focus weight
    const up=i===0?1:E.inOut(prog(t,S[i]-1.3,1.2));
    const down=i<4?1-E.inOut(prog(t,S[i+1]-1.3,1.2)):1;
    let w=Math.min(up,down); w=lerp(w,1,ovP);
    el.style.opacity=lerp(0.42,1,w);
    if(i===0){ const p=E.outExpo(prog(t,0.0,0.9)); el.style.transform=`translateY(${(1-p)*90}px) scale(${lerp(0.96,1,p)})`; el.style.filter=p<0.98?`blur(${(1-p)*10}px)`:"none"; el.style.opacity=clamp(t/0.35)*lerp(0.42,1,w); }
  });
  // connectors
  links.forEach((L,i)=>{
    const he=holdEnd(i);
    const d=E.outCubic(prog(t,he-0.6,1.0));
    L.p.style.strokeDashoffset=L.len*(1-d);
    L.e1.style.opacity=d>0?1:0; L.e2.style.opacity=d>=1?1:0;
    const pp=E.inOut(prog(t,he,S[i+1]-he));
    const vis=t>=he-0.1&&t<S[i+1]+0.6;
    L.pk.style.opacity=vis?Math.min(clamp((t-he+0.1)/0.15),1-clamp((t-S[i+1]-0.3)/0.3)):0;
    const pt=L.p.getPointAtLength(L.len*pp); L.pk.setAttribute("cx",pt.x); L.pk.setAttribute("cy",pt.y);
  });
  // hud: captions
  let active=-1; for(let i=0;i<5;i++) if(t>=S[i]-0.2) active=i;
  ST.forEach((s,i)=>{
    const cap=document.getElementById("cap"+i);
    const st=S[i]+0.12, out=holdEnd(i);
    if(t<st-0.05||t>out+0.45){ cap.style.display="none"; return; } cap.style.display="";
    const num=cap.querySelector(".num"); pop(num,t,st,{from:0.5});
    cap.querySelectorAll(".t span").forEach((w,j)=>rise(w,t,st+0.08+j*0.08,{dy:50,blur:8,d:0.6}));
    const xo=E.inCubic(prog(t,out,0.4));
    cap.style.opacity=1-xo; cap.style.transform=`translateY(${-18*xo}px)`; cap.style.filter=xo>0.01?`blur(${6*xo}px)`:"none";
  });
  // dots
  ST.forEach((_,i)=>{ const d=document.getElementById("sd"+i); d.style.background=i<=active&&t<T.pullback[0]+0.5?(i===active?"var(--text)":"var(--accentText)"):(t>=T.pullback[0]?"var(--accentText)":"var(--track)"); d.style.width=(i===active&&t<T.pullback[0])?"28px":"10px"; d.style.borderRadius="5px"; });
  const chromeO=clamp(t/0.5)*(1-clamp((t-T.end)/0.3));
  document.getElementById("tagl").style.opacity=chromeO; document.getElementById("tagr").style.opacity=chromeO;
  // map
  const mo=clamp(t/0.6)*(1-E.inCubic(prog(t,T.pullback[0],0.5)));
  mapEl.style.opacity=mo; mapEl.style.display=mo<=0?"none":"";
  ST.forEach((_,i)=>{ document.getElementById("mr"+i).style.background=i===active?"var(--accent)":i<active?"oklch(0.82 0.04 120)":"var(--track)"; });
  const vw=1920/cam.z, vh=1080/cam.z;
  mapCam.style.left=((cam.x-vw/2)-bbox.x+150)*mapScale+"px"; mapCam.style.top=((cam.y-vh/2)-bbox.y+150)*mapScale+"px";
  mapCam.style.width=vw*mapScale+"px"; mapCam.style.height=vh*mapScale+"px";
  // headline
  const hl=document.getElementById("headline");
  hl.style.display=t>=T.headline-0.05&&t<T.end+0.6?"":"none";
  hl.querySelectorAll(".w").forEach(w=>{ const i=+w.dataset.i; rise(w,t,T.headline+i*0.1,{dy:80,blur:10,d:0.7}); });
  document.getElementById("hlbar").style.transform=`scaleX(${E.outExpo(prog(t,T.headline+0.6,0.6))})`;
  // cursors
  CUR.forEach(cu=>{
    const st=curState(cu,t);
    const sx=960+(st.x-cam.x)*cam.z, sy=540+(st.y-cam.y)*cam.z;
    let sc=1, ring=0, ringO=0;
    cu.keys.forEach(k=>{ if(k.click){ const tc=k.t+0.02; const p=clamp((t-tc)/0.18); if(t>=tc&&t<tc+0.18) sc=Math.min(sc,1-0.16*Math.sin(Math.PI*p)); const rp=prog(t,tc,0.45); if(t>=tc&&t<tc+0.45){ ring=E.outCubic(rp); ringO=1-rp; } } });
    cu.el.style.opacity=st.o*(t>=T.end?0:1);
    cu.el.style.transform=`translate(${sx}px,${sy}px) scale(${sc})`;
    cu.el.querySelector(".name").style.top=st.pill==="up"?"-30px":"34px";
    const r=cu.el.querySelector(".ring"); r.style.opacity=ringO; r.style.transform=`scale(${0.3+ring*0.9})`;
  });
  // end card
  const ec=document.getElementById("endcard");
  const eo=E.outCubic(prog(t,T.end,0.45));
  ec.style.opacity=eo; ec.style.display=eo<=0?"none":"flex";
  if(eo>0){
    const lt=t-T.end; const k=1+0.03*E.inOutSine(prog(lt,0,4));
    ec.style.transform=`scale(${k})`;
    pop(document.getElementById("e-mark"),lt,0.3,{from:0.4,d:0.5});
    rise(document.getElementById("e-w1"),lt,0.42,{dy:70});
    rise(document.getElementById("e-w2"),lt,0.6,{dy:50});
    pop(document.getElementById("e-pill"),lt,1.0,{from:0.7});
    rise(document.getElementById("e-url"),lt,1.5,{dy:40,blur:6});
    rise(document.getElementById("e-small"),lt,1.8,{dy:30,blur:6});
  }
  document.getElementById("stage").style.filter="";
}
window.seek=seek;
})();
</script>
