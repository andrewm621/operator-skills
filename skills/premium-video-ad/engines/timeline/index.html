.mark i{position:absolute;left:34.4%;top:34.4%;width:31.2%;height:31.2%;border-radius:25%;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:calc(20px*var(--k));font-weight:600;white-space:nowrap}

.panel{position:absolute;border-radius:20px;background:var(--surface);border:1px solid var(--border2);box-shadow:var(--shadow);overflow:hidden}
.phead{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--border);background:var(--bar);font-size:calc(20px*var(--k));font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.bitem{position:absolute;left:10px;right:10px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:12px;font-size:calc(17px*var(--k));font-weight:600;white-space:nowrap;background:var(--row);border:1px solid var(--border)}
.bitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bthumb{position:relative;border-radius:6px;overflow:hidden;flex:none;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted)}

.mon{position:absolute;border-radius:20px;overflow:hidden;border:1px solid var(--border2);box-shadow:var(--shadow),0 0 0 10px rgba(255,255,255,.025);background:#0b0b0d}
.burn{position:absolute;font-family:var(--display);font-weight:var(--displayWeight);letter-spacing:var(--tracking);line-height:1.02;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.45);white-space:nowrap}

.view{position:absolute;left:0;right:0;bottom:0;padding:20px 22px}

.irow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-size:calc(19px*var(--k));white-space:nowrap}

.tl{position:absolute;border-radius:20px;background:var(--tl);border:1px solid var(--border2);box-shadow:var(--shadow);overflow:hidden}
.thd{position:absolute;left:0;display:flex;align-items:center;gap:8px;padding-left:18px;background:var(--bar);border-right:1px solid var(--border);border-bottom:1px solid var(--border);font-size:calc(19px*var(--k));font-weight:700;color:var(--muted);white-space:nowrap}
.trow{position:absolute;right:0;border-bottom:1px solid var(--border)}
.clip{position:absolute;border-radius:9px;overflow:hidden;border:2px solid rgba(255,255,255,.18);background:#222}
.strip{position:absolute;left:0;top:0;bottom:0;display:flex}
.strip>div{position:relative;flex:none;height:100%;border-right:1px solid rgba(0,0,0,.35);overflow:hidden}
.clip .lab{position:absolute;left:8px;top:6px;padding:3px 10px;border-radius:6px;background:rgba(10,10,10,.72);font-size:calc(17px*var(--k));font-weight:600;white-space:nowrap;color:#fff;z-index:2}
.tclip{position:absolute;border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 12px;text-overflow:ellipsis;font-size:calc(18px*var(--k));font-weight:700;white-space:nowrap;overflow:hidden;background:var(--accent);color:var(--onAccent)}
.tick{position:absolute;bottom:0;width:1px;background:var(--border2)}
.tlab{position:absolute;font-size:calc(16px*var(--k));color:var(--faint);transform:translateX(-50%);font-variant-numeric:tabular-nums;white-space:nowrap}
.ph{position:absolute;width:3px;background:var(--accent);box-shadow:0 0 18px var(--accentGlow);z-index:20}

.crop.tl:before{left:-56px;top:0;width:44px;height:1.5px}.crop.tl:after{left:0;top:-56px;width:1.5px;height:44px}
.crop.tr:before{left:12px;top:0;width:44px;height:1.5px}.crop.tr:after{left:0;top:-56px;width:1.5px;height:44px}
.crop.bl:before{left:-56px;top:0;width:44px;height:1.5px}.crop.bl:after{left:0;top:12px;width:1.5px;height:44px}

.hlw .base{position:relative;z-index:1}
.hlw .ink{position:absolute;left:0;top:0;z-index:2;color:var(--onAccent)}
</style></head>

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));

// ---------- time ----------
let resolveReady;window.ready=new Promise(r=>resolveReady=r).then(async()=>{await document.fonts.ready;
  await Promise.all([document.fonts.load("600 100px Fraunces"),document.fonts.load("italic 300 100px Fraunces"),document.fonts.load("600 30px Inter")]);

window.seek=function(t){const A=R.A,T=R.T,P=T.proof;
  const gA=document.getElementById('gA'),gB=document.getElementById('gB');
  gA.style.background='radial-gradient(circle,var(--glowA),transparent 65%)';gB.style.background='radial-gradient(circle,var(--glowB),transparent 65%)';

  document.getElementById('grid').style.transform=`translate(${(t*6)%80}px,${(t*4)%80}px)`;
  const world=document.getElementById('world'),hook=document.getElementById('hook'),pay=document.getElementById('pay'),endl=document.getElementById('endl');

  // ----- HOOK + page frame -----
  vis(hook,t<T.tension);
  if(t<T.tension){const s=1+0.03*t/T.tension;hook.style.transform=`scale(${s})`;
    R.hookLines.forEach((Ln,i)=>{rise(Ln.d,t,i*1.0,80,0.7);drawMark(Ln,t,i*1.0+0.35)})}
  const pageOn=t<T.tension||(t>=T.payoff+0.2&&t<T.end+0.25);vis(R.page.page,pageOn);
  if(pageOn){const f=A[t<T.tension?'hook':'payoff'].folio||['','',''];R.page.folio.innerHTML=f.map(x=>`<span>${x}</span>`).join('');
    const s=t<T.tension?0:T.payoff+0.2;const o=clamp((t-s)/0.4);const out=t>=T.end?1-clamp((t-T.end)/0.25):1;R.page.page.style.opacity=o*out;R.page.rule.style.transform=`scaleX(${outExpo(prog(t,s,0.8))})`}

  // ----- EDITOR WORLD -----
  const wOn=t>=T.tension&&t<T.payoff+0.5;vis(world,wOn);
  if(wOn){
    const c=L.cam(t);const lt=t-T.tension;
    world.style.transform=`translate(${L.W/2}px,${L.H/2}px) scale(${c.z}) translate(${-c.x}px,${-c.y}px)`;
    const tl=R.toTL(t);const phx=R.pxs(tl);
    // bin: items pile in faster and faster
    const LAND=[0,.5,1,1.25,1.5,1.625,1.75,1.875];
    let shown=0;
    R.binItems.forEach((r,i)=>{const at=T.tension+(LAND[i]??(1.875+i*0.0625));const p=prog(t,at-0.05,0.4);if(t>=at-0.05)shown++;
      const k=outBack(p);r.style.opacity=clamp(p*3);r.style.transform=`translateY(${(1-outExpo(p))*-60}px) rotate(${(1-k)*(i%2?4:-4)}deg) scale(${lerp(.85,1,k)})`;
      const it=R.A.tension.items[i];let used=false;
      if(it.kind){const k2=R.films.findIndex(f=>f.i===i);used=t>=R.snapV1[k2]-0.35}else used=t>=T.reveal;
      r.querySelector('.ok').style.display=used&&t>=T.reveal?'inline-flex':'none';
      if(used)r.style.opacity=(+r.style.opacity)*(it.kind&&t<R.snapV1[R.films.findIndex(f=>f.i===i)]?0.35:0.45)});
    R.binCount.textContent=String(shown);
    // monitor
    const pre=t<T.reveal;R.mempty.style.opacity=pre?1-outExpo(prog(t,T.tension+2.0,0.3)):0;
    let active=-1;if(!pre){for(let k=0;k<R.films.length;k++){if(tl>=R.cuts[k]&&t>=R.snapV1[k])active=k}}
    R.monFilms.forEach((m,k)=>{const on=k===active;m.style.opacity=on?1:0;if(on){const lp=(tl-R.cuts[k])/(R.cuts[k+1]-R.cuts[k]);m.style.transform=`scale(${1.02+0.05*lp}) translateX(${-lp*14}px)`}});
    R.scrim.style.opacity=active>=0?1:0;
    R.mtc.textContent=tcode(tl);
    R.q.b.style.display=pre?'block':'none';if(pre){R.q.ls.forEach((d,i)=>rise(d,t,T.tension+2.0+i*0.25,60));}
    const inRev=t>=T.reveal&&t<P[0];R.claim.b.style.display=inRev?'block':'none';
    if(inRev){R.claim.ls.forEach((d,i)=>{rise(d,t,T.reveal+i*1.0,60,0.55);fadeOut(d,t,P[0]-0.22,0.22)})}
    R.ptitles.forEach((k,i)=>{const s=P[i],e=i<2?P[i+1]:T.payoff;const on=t>=s&&t<e;k.b.style.display=on?'block':'none';
      if(on){k.ls.forEach((d,j)=>{rise(d,t,s+j*0.18,60,0.6);fadeOut(d,t,e-0.22,0.22)});rise(k.sub,t,s+0.45,30);fadeOut(k.sub,t,e-0.22,0.22)}});
    const tagOn=t>=T.reveal&&t<T.payoff;R.ttag.style.display=tagOn?'inline-flex':'none';
    if(tagOn){const blk=inRev?R.claim.b:R.ptitles[P.findLastIndex(x=>t>=x)].b;R.ttag.style.top=(parseFloat(blk.style.top)-44*L.MON.w/1102)+'px';const cut=[T.reveal,...P].findLast(x=>t>=x);pop(R.ttag,t,cut,0.3)}
    // order panel views
    const VW=[[T.tension,P[0]],[P[0],P[1]],[P[1],P[2]],[P[2],T.payoff]];
    let cur=0;VW.forEach((w,i)=>{if(t>=w[0])cur=i});
    R.views.forEach((v,i)=>{const [s,e]=VW[i];const on=t>=s-0.001&&t<e;v.node.style.display=on?'block':'none';if(!on)return;
      const p=outExpo(prog(t,s,0.35));const x=i===0?0:(1-p)*60;v.node.style.opacity=i===0?1:clamp(p*1.6);v.node.style.transform=`translateX(${x}px)`;
      v.render(i===0?t:t-s,T);if(i<3&&t>e-0.2){const q=inCubic(prog(t,e-0.2,0.2));v.node.style.opacity*=1-q;v.node.style.transform=`translateX(${-q*40}px)`}});
    const v=R.views[cur];R.oTitle.textContent=v.title;
    if(v.tag&&t-VW[cur][0]>=v.tagAt){R.oTag.innerHTML=v.tag;pop(R.oTag.firstChild,t-VW[cur][0],v.tagAt,0.35)}else R.oTag.innerHTML='';

    R.tlc&&(R.tlc.textContent=tcode(tl).slice(3));
    R.ph.style.left=(phx-1)+'px';
    R.v1empty.style.opacity=pre?1:0;
    R.v1.forEach((c,k)=>{const s=R.snapV1[k];const on=t>=s;c.style.display=on?'block':'none';if(!on)return;
      const p=prog(t,s,0.3);c.style.transform=`scaleY(${lerp(1.12,1,outBack(p))})`;c.style.borderColor=t<s+0.3?'var(--accent)':'rgba(255,255,255,.18)';c.style.boxShadow=t<s+0.3?`0 0 ${30*(1-p)}px var(--accentGlow)`:''});
    R.v2.forEach((c,k)=>{const s=R.titles[k].snap;const on=t>=s;c.style.display=on?'flex':'none';if(!on)return;
      const p=prog(t,s,0.3);c.style.transform=`translateY(${(1-outExpo(p))*-30}px)`;c.style.opacity=clamp(p*3);
      const live=tl>=R.titles[k].a&&tl<R.titles[k].b&&t>=T.reveal;c.style.background=live?'var(--accent)':'var(--surface2)';c.style.color=live?'var(--onAccent)':'var(--muted)';c.style.border=live?'none':'1px solid var(--border2)'});
    R.a1.style.display=t>=T.reveal?'block':'none';R.a1.style.clipPath=`inset(0 ${(1-outExpo(prog(t,T.reveal,0.3)))*100}% 0 0 round 9px)`;
    R.dia.forEach((d,k)=>{d.style.opacity=t>=R.snapV1[k+1]?1:0});
    // flights: bin row -> V1 slot, landing exactly on the beat
    const tlR=L.TL;
    R.fly.forEach((f,k)=>{const s=R.snapV1[k],d=0.35;const on=t>=s-d&&t<s;f.style.display=on?'block':'none';if(!on)return;
      const p=inOut(prog(t,s-d,d));const br=R.binItems[R.films[k].i];
      const from={x:L.BIN.x+10,y:L.BIN.y+parseFloat(br.style.top),w:L.BIN.w-20,h:L.binRow};
      const to={x:tlR.x+R.pxs(R.cuts[k])+2,y:tlR.y+R.v1rect.y,w:R.pxs(R.cuts[k+1])-R.pxs(R.cuts[k])-4,h:R.v1rect.h};
      box(f,{x:lerp(from.x,to.x,p),y:lerp(from.y,to.y,p)-Math.sin(Math.PI*p)*(V?80:140),w:lerp(from.w,to.w,p),h:lerp(from.h,to.h,p)});f.style.transform=`rotate(${-6*Math.sin(Math.PI*p)}deg)`});
    {const s=T.reveal,d=0.3;const f=R.flyMusic;const on=t>=s-d&&t<s;f.style.display=on?'flex':'none';
      if(on){const p=inOut(prog(t,s-d,d));const mi=R.A.tension.items.findIndex(x=>x.music);const br=R.binItems[mi];
        const from={x:L.BIN.x+10,y:L.BIN.y+parseFloat(br.style.top)};const to={x:tlR.x+R.pxs(0),y:tlR.y+L.TL.rows.A1[0]+8};
        f.style.left=lerp(from.x,to.x,p)+'px';f.style.top=(lerp(from.y,to.y,p)-Math.sin(Math.PI*p)*60)+'px';f.style.width=(L.BIN.w-20)+'px';f.style.height=L.binRow+'px'}}
    // payoff collapse: panels fade, tracks fold into the V1 row
    const cp=prog(t,T.payoff,0.4),ce=inOut(cp);
    [R.bin,R.mon,R.ord].forEach(p=>{p.style.opacity=1-ce;p.style.filter=ce?`blur(${ce*8}px)`:'';p.style.transform=ce?`scale(${1-0.04*ce})`:''});
    R.tl.style.background=t>=T.payoff?`color-mix(in oklab, var(--tl) ${100-ce*100}%, transparent)`:'';R.tl.style.borderColor=t>=T.payoff?`rgba(255,255,255,${0.12*(1-ce)})`:'';R.tl.style.boxShadow=t>=T.payoff&&ce>0.5?'none':'';

    if(t>=T.payoff){const dy2=(R.v1rect.y-parseFloat(R.v2[0].style.top))*ce,dyA=(R.v1rect.y-parseFloat(R.a1.style.top))*ce;
      R.v2.forEach(c=>{c.style.transform=`translateY(${dy2}px)`;c.style.opacity=1-ce});R.a1.style.transform=`translateY(${dyA}px)`;R.a1.style.opacity=1-ce;R.dia.forEach(d=>d.style.opacity=1-ce)}
    else{R.a1.style.transform='';R.a1.style.opacity=1}

    if(done)pop(R.exState,t,T.payoff+2.5,0.35);else{R.exState.style.transform='';R.exState.style.opacity=t>=T.payoff+1.0?1:0}
    R.exPh.style.display=t>=T.payoff+0.35?'block':'none';const phx=r.x+r.w*(t>=T.end?1:xp);Object.assign(R.exPh.style,{left:(phx-1)+'px',top:(r.y-20)+'px',height:(r.h+40)+'px',zIndex:6})
  }

  if(t>=T.end){const lt=t-T.end;const p=outExpo(prog(lt,0,0.45));R.em.style.opacity=clamp(p*1.5);R.em.style.transform=`scale(${lerp(.94,1,p)+0.012*lt/3})`;
    pop(R.emark,lt,0.2,0.5);rise(R.ew1,lt,0.35);rise(R.ew2,lt,0.5);pop(R.epill,lt,1.0,0.45);rise(R.eurl,lt,1.5,30);
    R.echips.forEach((c,i)=>pop(c,lt,1.0+i*0.125,0.4));pop(R.ebtn,lt,1.5,0.45)}
};
