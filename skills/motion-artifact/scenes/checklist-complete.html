<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Checklist complete</title>
<!--
  PRESET square · 800×800 · ~6.0s
  SHOWS  sequence() ticking pre-built rows, then a summary landing. Square
         crops well for LinkedIn and IG feeds, where 16:9 gets letterboxed.
  FORK   swap the five rows and the closing line. Keep it to five — a square
         feed clip is read at thumbnail size.
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0E1014; --panel:#171A20; --line:#252A33; --text:#EDF0F4;
    --dim:#8D95A3; --accent:#A78BFA; --ok:#4ADE80;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  html,body{width:800px;height:800px;overflow:hidden;background:var(--bg)}
  body{font-family:var(--ui);color:var(--text);display:flex;align-items:center;justify-content:center}

  .card{position:relative;width:680px;height:680px;background:var(--panel);
        border:1px solid var(--line);border-radius:24px;padding:46px 44px;
        display:flex;flex-direction:column}

  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
           color:var(--accent);margin-bottom:14px}
  h1{font-size:38px;line-height:1.14;letter-spacing:-.028em;font-weight:680;margin-bottom:34px}

  .rows{display:flex;flex-direction:column;gap:14px;flex:1}
  .row{display:flex;align-items:center;gap:15px;font-size:19px;color:var(--dim)}
  .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;
       display:flex;align-items:center;justify-content:center}
  .box svg{opacity:0;width:16px;height:16px}
  .row.on{color:var(--text)}
  .row.on .box{border-color:var(--ok);background:rgba(74,222,128,.12)}
  .row.on .box svg{opacity:1}

  .foot{display:flex;align-items:baseline;gap:11px;padding-top:26px;border-top:1px solid var(--line)}
  .foot .n{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
           color:var(--ok)}
  .foot .l{font-size:16px;color:var(--dim);opacity:0}
  .foot .l.on{opacity:1}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Release 4.2</div>
    <h1>Everything that shipped<br />this week</h1>

    <div class="rows" id="rows">
      <div class="row"><span class="box"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 5" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Scheduled publishing</div>
      <div class="row"><span class="box"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 5" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Custom domains</div>
      <div class="row"><span class="box"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 5" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Password-gated pages</div>
      <div class="row"><span class="box"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 5" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Read analytics</div>
      <div class="row"><span class="box"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 5" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Agent endpoint (beta)</div>
    </div>

    <div class="foot">
      <span class="n" id="n">0</span>
      <span class="l" id="l">shipped in seven days</span>
    </div>
  </div>

<script src="motion.js"></script>
<script>
(function () {
  var S = Motion.scene({ width: 800, height: 800, fps: 30, tail: 1300 });

  S.sequence('#rows .row', { start: 500, dur: 3400 });
  S.counter('#n', { start: 500, dur: 3400, from: 0, to: 5, ease: 'linear' });
  S.classFor('#l', 'on', { start: 4000 });

  S.mount();
})();
</script>
</body>
</html>
