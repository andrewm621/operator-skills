<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dashboard fill</title>
<!--
  PRESET desktop · 1200×675 · ~6.3s
  SHOWS  counter() + progress() + tween({height}) on a bar chart. The
         "numbers land" clip for launch posts and release notes.
  FORK   change the four tiles, the bar heights, and the axis labels.
  NOTE   bars tween height in px (unit:'px'), anchored bottom — so no cue
         fights the chart's layout.
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0B0F14; --panel:#121821; --line:#1E2833; --text:#E8EDF2;
    --dim:#8B9AAB; --accent:#38BDF8; --ok:#34D399;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  html,body{width:1200px;height:675px;overflow:hidden;background:var(--bg)}
  body{font-family:var(--ui);color:var(--text);display:flex;align-items:center;justify-content:center}

  .app{position:relative;width:1020px;height:570px;background:var(--panel);
       border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .chrome{display:flex;align-items:center;justify-content:space-between;height:48px;
          padding:0 22px;border-bottom:1px solid var(--line)}
  .ttl{font-size:13.5px;font-weight:620}
  .badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
         color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
  .badge.live{color:var(--ok);border-color:rgba(52,211,153,.42);background:rgba(52,211,153,.08)}

  .body{padding:22px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .tile{opacity:0;border:1px solid var(--line);border-radius:11px;padding:14px 15px}
  .tile .k{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
           color:var(--dim);margin-bottom:9px}
  .tile .v{font-size:27px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile .d{font-size:11.5px;color:var(--ok);margin-top:5px}

  .split{display:grid;grid-template-columns:1.55fr 1fr;gap:12px}
  .card{border:1px solid var(--line);border-radius:11px;padding:15px 17px}
  .card .h{font-size:12.5px;font-weight:600;margin-bottom:15px}

  .chart{height:184px;display:flex;align-items:flex-end;gap:13px}
  .barwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{width:100%;height:0;background:var(--accent);border-radius:5px 5px 0 0;opacity:.85}
  .barwrap:last-child .bar{background:var(--ok);opacity:1}
  .barwrap .x{font-family:var(--mono);font-size:10px;color:var(--dim)}

  .meters{display:flex;flex-direction:column;gap:15px}
  .meter .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:7px}
  .meter .track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
  .meter .fill{height:100%;width:0%;background:var(--accent);border-radius:99px}
</style>
</head>
<body>
  <div class="app">
    <div class="chrome">
      <div class="ttl">Weekly summary</div>
      <div class="badge" id="badge">syncing</div>
    </div>

    <div class="body">
      <div class="tiles">
        <div class="tile"><div class="k">Published</div><div class="v" id="v1">0</div><div class="d">+18% wk</div></div>
        <div class="tile"><div class="k">Viewers</div><div class="v" id="v2">0</div><div class="d">+41% wk</div></div>
        <div class="tile"><div class="k">Avg. read</div><div class="v" id="v3">0s</div><div class="d">+12s wk</div></div>
        <div class="tile"><div class="k">Replies</div><div class="v" id="v4">0</div><div class="d">+7% wk</div></div>
      </div>

      <div class="split">
        <div class="card">
          <div class="h">Views by day</div>
          <div class="chart">
            <div class="barwrap"><div class="bar" id="b1"></div><div class="x">Mon</div></div>
            <div class="barwrap"><div class="bar" id="b2"></div><div class="x">Tue</div></div>
            <div class="barwrap"><div class="bar" id="b3"></div><div class="x">Wed</div></div>
            <div class="barwrap"><div class="bar" id="b4"></div><div class="x">Thu</div></div>
            <div class="barwrap"><div class="bar" id="b5"></div><div class="x">Fri</div></div>
            <div class="barwrap"><div class="bar" id="b6"></div><div class="x">Sat</div></div>
          </div>
        </div>

        <div class="card">
          <div class="h">Top pages</div>
          <div class="meters">
            <div class="meter"><div class="lab"><span>Launch recap</span><span>48%</span></div>
              <div class="track"><div class="fill" id="m1"></div></div></div>
            <div class="meter"><div class="lab"><span>Pricing</span><span>31%</span></div>
              <div class="track"><div class="fill" id="m2"></div></div></div>
            <div class="meter"><div class="lab"><span>Changelog</span><span>14%</span></div>
              <div class="track"><div class="fill" id="m3"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="motion.js"></script>
<script>
(function () {
  var S = Motion.scene({ width: 1200, height: 675, fps: 30, tail: 1100 });

  S.reveal('.tile', { start: 300, dur: 430, stagger: 130, y: 12 });

  S.counter('#v1', { start: 600,  dur: 900, from: 0, to: 128 });
  S.counter('#v2', { start: 720,  dur: 900, from: 0, to: 9420 });
  S.counter('#v3', { start: 840,  dur: 900, from: 0, to: 74,
                     format: function (v) { return Math.round(v) + 's'; } });
  S.counter('#v4', { start: 960,  dur: 900, from: 0, to: 312 });

  // Bars grow from the baseline. Heights in px so the flex row keeps its shape.
  var heights = [88, 112, 96, 140, 122, 168];
  heights.forEach(function (h, i) {
    S.tween('#b' + (i + 1), {
      start: 1500 + i * 110, dur: 620, ease: 'out',
      height: [0, h], unit: 'px'
    });
  });

  S.progress('#m1', { start: 2600, dur: 900, to: 48 });
  S.progress('#m2', { start: 2760, dur: 900, to: 31 });
  S.progress('#m3', { start: 2920, dur: 900, to: 14 });

  S.states('#badge', [
    { at: 0, text: 'syncing' },
    { at: 3900, text: 'up to date', cls: 'live' }
  ]);

  S.mount();
})();
</script>
</body>
</html>
